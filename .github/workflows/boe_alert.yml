name: BOE Telegram Alert

on:
  schedule:
    # Todos los días laborables a las 09:15 UTC (~11:15 hora España en verano,
    # 10:15 en invierno). El BOE suele publicar sobre las 8h, así da margen.
    - cron: "15 9 * * 1-5"
  workflow_dispatch: {}  # permite lanzarlo a mano desde la pestaña "Actions" de GitHub, para probar

permissions:
  contents: write  # necesario para poder hacer commit de seen_ids.json

jobs:
  check-boe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run BOE check and send Telegram alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python boe_telegram_alert.py

      - name: Commit updated seen_ids.json (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_ids.json
          if git diff --staged --quiet; then
            echo "seen_ids.json no ha cambiado, nada que commitear."
          else
            git commit -m "Update seen_ids.json [skip ci]"
            git push
            echo "seen_ids.json actualizado y subido correctamente."
          fi
